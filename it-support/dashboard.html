<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Особистий кабінет | IT Support</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>IT Support</h1>
        <div class="user-info">
            <span id="user-name">Користувач</span>
            <div class="notification-widget">
                <button id="notifications-button" class="notification-button" type="button" aria-label="Сповіщення" aria-expanded="false" aria-controls="notifications-panel">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
                    <span id="notifications-count" class="notification-count hidden"></span>
                </button>
                <section id="notifications-panel" class="notification-panel hidden" aria-label="Сповіщення">
                    <div class="notification-panel-heading">
                        <h2>Сповіщення</h2>
                        <button id="notifications-mark-all" class="notification-text-button" type="button">Позначити всі прочитаними</button>
                    </div>
                    <p id="notifications-message" class="notification-message hidden" role="status"></p>
                    <div id="notifications-list" class="notification-list"></div>
                </section>
            </div>
            <a class="profile-link" href="profile.html">Профіль</a>
            <button id="logout-btn">Вийти</button>
        </div>
    </header>
    <main class="container">
        <div class="dashboard-controls">
            <h2>Мої заявки</h2>
            <a href="create-request.html" class="btn">Створити нову заявку</a>
        </div>
        <div class="filters">
            <input type="text" id="search-requests" placeholder="Пошук за назвою...">
            <select id="filter-status">
                <option value="">Всі статуси</option>
                <option value="new">Нова</option>
                <option value="in_progress">У роботі</option>
                <option value="waiting">Очікування</option>
                <option value="completed">Завершена</option>
                <option value="rejected">Відхилена</option>
            </select>
        </div>
        <div id="dashboard-message" class="message" role="status" aria-live="polite"></div>
        <div id="loading-indicator" class="hidden">Завантаження...</div>
        <table id="user-requests-table">
            <thead>
                <tr>
                    <th>№</th>
                    <th>Дата</th>
                    <th>Назва / Проблема</th>
                    <th>Статус</th>
                    <th>Коментар / результат ремонту</th>
                    <th>Історія</th>
                </tr>
            </thead>
            <tbody id="user-requests-body">
                <!-- Дані завантажуватимуться через JS -->
            </tbody>
        </table>
    </main>
    <dialog id="request-history-dialog" class="request-history-dialog" aria-labelledby="request-history-title">
        <div class="request-history-heading">
            <div><p class="eyebrow">ІСТОРІЯ ЗМІН</p><h2 id="request-history-title">Заявка</h2></div>
            <button id="request-history-close" class="button-secondary button-small" type="button">Закрити</button>
        </div>
        <p id="request-history-message" class="notification-message hidden" role="status"></p>
        <ol id="request-history-list" class="request-history-list"></ol>
    </dialog>
    <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
