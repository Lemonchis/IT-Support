<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація | IT Support</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container auth-container">
        <h2>Реєстрація</h2>
        <form id="register-form" autocomplete="off">
            <label for="reg-fullname">Ім'я та прізвище:</label>
            <input type="text" id="reg-fullname" name="full_name" autocomplete="name" required>

            <label for="reg-email">Електронна пошта:</label>
            <input type="email" id="reg-email" name="email" autocomplete="email" required>

            <label for="reg-password">Пароль:</label>
            <input type="password" id="reg-password" name="new-password" autocomplete="new-password" required minlength="6">

            <label for="reg-confirm-password">Підтвердження пароля:</label>
            <input type="password" id="reg-confirm-password" name="confirm-password" autocomplete="new-password" required minlength="6">

            <button type="submit">Зареєструватися</button>
            <div id="reg-message" class="message"></div>
        </form>
        <p>Вже є акаунт? <a href="index.html">Увійти</a></p>
    </div>
    <script type="module" src="../js/auth.js"></script>
</body>
</html>
