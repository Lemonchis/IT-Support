<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Менеджера | IT Support</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Панель Менеджера</h1>
        <div class="user-info">
            <span id="manager-name">Менеджер</span>
            <a class="profile-link" href="profile.html">Профіль</a>
            <button id="logout-btn">Вийти</button>
        </div>
    </header>
    <main class="container-fluid">
        <div class="dashboard-controls">
            <h2>Контроль виконання заявок</h2>
            <button id="manager-export-report" type="button">Завантажити звіт CSV</button>
        </div>
        <section class="stats manager-stats" aria-label="Статистика заявок">
            <article class="stat-card"><span class="stat-label">Усього заявок</span><strong id="manager-stat-total">0</strong></article>
            <article class="stat-card"><span class="stat-label">Нові</span><strong id="manager-stat-new">0</strong></article>
            <article class="stat-card"><span class="stat-label">У роботі / очікують</span><strong id="manager-stat-active">0</strong></article>
            <article class="stat-card"><span class="stat-label">Прострочені</span><strong id="manager-stat-overdue">0</strong></article>
            <article class="stat-card"><span class="stat-label">Завершені</span><strong id="manager-stat-completed">0</strong></article>
        </section>
        <div class="filters">
            <input type="text" id="manager-search" placeholder="Пошук заявок...">
            <select id="manager-filter-priority">
                <option value="">Всі пріоритети</option>
                <option value="low">Низький</option>
                <option value="medium">Середній</option>
                <option value="high">Високий</option>
                <option value="critical">Критичний</option>
            </select>
            <select id="manager-filter-status" aria-label="Фільтр за статусом">
                <option value="">Усі статуси</option>
                <option value="new">Нова</option>
                <option value="in_progress">У роботі</option>
                <option value="waiting">Очікування</option>
                <option value="completed">Завершена</option>
                <option value="rejected">Відхилена</option>
            </select>
        </div>
        <div id="manager-message" class="message" role="status" aria-live="polite"></div>
        <div id="manager-loading" class="loading-indicator">Завантаження заявок…</div>
        <table id="manager-requests-table">
            <thead>
                <tr>
                    <th>№</th>
                    <th>Дата</th>
                    <th>Заявник</th>
                    <th>Проблема</th>
                    <th>Статус</th>
                    <th>Пріоритет</th>
                    <th>Термін виконання</th>
                </tr>
            </thead>
            <tbody id="manager-requests-body"></tbody>
        </table>
    </main>
    <script type="module" src="../js/manager.js"></script>
</body>
</html>
